services:
  - type: web
    name: jollof-house-ordering
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: jollof-house-orders
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
